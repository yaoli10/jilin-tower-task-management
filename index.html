<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吉林铁塔任务管理原型</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --howso-primary: #2563eb;
      --howso-primary-50: #eff6ff;
      --howso-primary-100: #dbeafe;
      --howso-primary-500: #3b82f6;
      --howso-primary-600: #2563eb;
      --howso-primary-700: #1d4ed8;
      --howso-success: #10b981;
      --howso-warning: #f59e0b;
      --howso-error: #ef4444;
      --howso-info: #3b82f6;
      --howso-background: #f8fafc;
      --howso-foreground: #0f172a;
      --howso-muted: #f1f5f9;
      --howso-muted-foreground: #64748b;
      --howso-border: #e2e8f0;
      --howso-card: #ffffff;
    }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--howso-background);
      color: var(--howso-foreground);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
  <div class="max-w-md w-full space-y-6">
    <div class="text-center space-y-2">
      <div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <i data-lucide="tower-control" class="w-8 h-8 text-primary"></i>
      </div>
      <h1 class="text-2xl font-bold text-foreground">吉林铁塔任务管理原型</h1>
      <p class="text-sm text-muted-foreground">APP 端 + PC 端任务管理全流程闭环</p>
    </div>

    <div class="bg-card border border-border rounded-2xl p-6 shadow-sm space-y-4">
      <a href="pages/task-home.html" class="flex items-center justify-between p-4 rounded-xl border border-border hover:border-primary/50 hover:bg-primary/5 transition-colors group">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center">
            <i data-lucide="smartphone" class="w-5 h-5 text-primary"></i>
          </div>
          <div>
            <h3 class="font-semibold text-foreground">APP 端任务管理</h3>
            <p class="text-xs text-muted-foreground">移动端任务列表、筛选、创建</p>
          </div>
        </div>
        <i data-lucide="arrow-right" class="w-5 h-5 text-muted-foreground group-hover:text-primary transition-colors"></i>
      </a>

      <a href="pages/web-task-management.html" class="flex items-center justify-between p-4 rounded-xl border border-border hover:border-primary/50 hover:bg-primary/5 transition-colors group">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center">
            <i data-lucide="monitor" class="w-5 h-5 text-primary"></i>
          </div>
          <div>
            <h3 class="font-semibold text-foreground">PC 端任务管理</h3>
            <p class="text-xs text-muted-foreground">桌面端任务列表、统计、全流程</p>
          </div>
        </div>
        <i data-lucide="arrow-right" class="w-5 h-5 text-muted-foreground group-hover:text-primary transition-colors"></i>
      </a>
    </div>

    <p class="text-center text-xs text-muted-foreground">
      建议使用对应设备访问：手机打开 APP 端，电脑打开 PC 端
    </p>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
