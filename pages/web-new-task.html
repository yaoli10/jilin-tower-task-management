<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增任务</title>
    <style id="theme-vars">
:root {
  --brand-prefix: howso;
  --howso-primary-50: #eff6ff;
  --howso-primary-100: #dbeafe;
  --howso-primary-200: #bfdbfe;
  --howso-primary-300: #93c5fd;
  --howso-primary-400: #60a5fa;
  --howso-primary-500: #3b82f6;
  --howso-primary-600: #2563eb;
  --howso-primary-700: #1d4ed8;
  --howso-primary-800: #1e40af;
  --howso-primary-900: #1e3a8a;
  --howso-gray-50: #f8fafc;
  --howso-gray-100: #f1f5f9;
  --howso-gray-200: #e2e8f0;
  --howso-gray-300: #cbd5e1;
  --howso-gray-400: #94a3b8;
  --howso-gray-500: #64748b;
  --howso-gray-600: #475569;
  --howso-gray-700: #334155;
  --howso-gray-800: #1e293b;
  --howso-gray-900: #0f172a;
  --howso-state-success: #10b981;
  --howso-state-warning: #f59e0b;
  --howso-state-error: #ef4444;
  --howso-state-info: #3b82f6;
  --howso-background: #ffffff;
  --howso-foreground: #0f172a;
  --howso-card: #ffffff;
  --howso-card-foreground: #0f172a;
  --howso-popover: #ffffff;
  --howso-popover-foreground: #0f172a;
  --howso-primary: #2563eb;
  --howso-primary-foreground: #ffffff;
  --howso-muted: #f1f5f9;
  --howso-muted-foreground: #64748b;
  --howso-border: #e2e8f0;
  --howso-input: #e2e8f0;
  --howso-ring: #3b82f6;
  --howso-radius-small: 4px;
  --howso-radius-medium: 8px;
  --howso-radius-large: 12px;
}
.dark {
  --howso-background: #0f172a;
  --howso-foreground: #f8fafc;
  --howso-card: #1e293b;
  --howso-card-foreground: #f8fafc;
  --howso-popover: #1e293b;
  --howso-popover-foreground: #f8fafc;
  --howso-primary: #3b82f6;
  --howso-primary-foreground: #ffffff;
  --howso-muted: #334155;
  --howso-muted-foreground: #94a3b8;
  --howso-border: #334155;
  --howso-input: #334155;
}
* { box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f1f5f9;
  color: var(--howso-foreground);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  margin: 0;
}
.howso-text-xs { font-size: 12px; line-height: 16px; }
.howso-text-sm { font-size: 13px; line-height: 18px; }
.howso-text-base { font-size: 14px; line-height: 20px; }
.howso-text-lg { font-size: 16px; line-height: 24px; }
.howso-text-xl { font-size: 18px; line-height: 28px; }
.howso-text-2xl { font-size: 20px; line-height: 30px; }
.howso-text-3xl { font-size: 24px; line-height: 32px; }
.howso-font-medium { font-weight: 500; }
.howso-font-semibold { font-weight: 600; }
.howso-font-bold { font-weight: 700; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--howso-background);
    --color-foreground: var(--howso-foreground);
    --color-card: var(--howso-card);
    --color-card-foreground: var(--howso-card-foreground);
    --color-popover: var(--howso-popover);
    --color-popover-foreground: var(--howso-popover-foreground);
    --color-primary: var(--howso-primary);
    --color-primary-foreground: var(--howso-primary-foreground);
    --color-muted: var(--howso-muted);
    --color-muted-foreground: var(--howso-muted-foreground);
    --color-border: var(--howso-border);
    --color-input: var(--howso-input);
    --color-ring: var(--howso-ring);
    --radius-sm: var(--howso-radius-small);
    --radius-md: var(--howso-radius-medium);
    --radius-lg: var(--howso-radius-large);
  }
  @layer base {
    body { background: #f1f5f9; color: var(--howso-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--howso-background); }
      .text-background { color: var(--howso-background); }
      .border-background { border-color: var(--howso-background); }
      .ring-background { --tw-ring-color: var(--howso-background); }
      .bg-foreground { background-color: var(--howso-foreground); }
      .text-foreground { color: var(--howso-foreground); }
      .border-foreground { border-color: var(--howso-foreground); }
      .ring-foreground { --tw-ring-color: var(--howso-foreground); }
      .bg-card { background-color: var(--howso-card); }
      .text-card { color: var(--howso-card); }
      .border-card { border-color: var(--howso-card); }
      .ring-card { --tw-ring-color: var(--howso-card); }
      .bg-card-foreground { background-color: var(--howso-card-foreground); }
      .text-card-foreground { color: var(--howso-card-foreground); }
      .border-card-foreground { border-color: var(--howso-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--howso-card-foreground); }
      .bg-popover { background-color: var(--howso-popover); }
      .text-popover { color: var(--howso-popover); }
      .border-popover { border-color: var(--howso-popover); }
      .ring-popover { --tw-ring-color: var(--howso-popover); }
      .bg-popover-foreground { background-color: var(--howso-popover-foreground); }
      .text-popover-foreground { color: var(--howso-popover-foreground); }
      .border-popover-foreground { border-color: var(--howso-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--howso-popover-foreground); }
      .bg-primary { background-color: var(--howso-primary); }
      .text-primary { color: var(--howso-primary); }
      .border-primary { border-color: var(--howso-primary); }
      .ring-primary { --tw-ring-color: var(--howso-primary); }
      .bg-primary-foreground { background-color: var(--howso-primary-foreground); }
      .text-primary-foreground { color: var(--howso-primary-foreground); }
      .border-primary-foreground { border-color: var(--howso-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--howso-primary-foreground); }
      .bg-muted { background-color: var(--howso-muted); }
      .text-muted { color: var(--howso-muted); }
      .border-muted { border-color: var(--howso-muted); }
      .ring-muted { --tw-ring-color: var(--howso-muted); }
      .bg-muted-foreground { background-color: var(--howso-muted-foreground); }
      .text-muted-foreground { color: var(--howso-muted-foreground); }
      .border-muted-foreground { border-color: var(--howso-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--howso-muted-foreground); }
      .bg-border { background-color: var(--howso-border); }
      .text-border { color: var(--howso-border); }
      .border-border { border-color: var(--howso-border); }
      .ring-border { --tw-ring-color: var(--howso-border); }
      .bg-input { background-color: var(--howso-input); }
      .text-input { color: var(--howso-input); }
      .border-input { border-color: var(--howso-input); }
      .ring-input { --tw-ring-color: var(--howso-input); }
      .bg-ring { background-color: var(--howso-ring); }
      .text-ring { color: var(--howso-ring); }
      .border-ring { border-color: var(--howso-ring); }
      .ring-ring { --tw-ring-color: var(--howso-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      .sidebar-link:hover { background-color: rgba(37, 99, 235, 0.06); }
      .sidebar-link.active { background-color: rgba(37, 99, 235, 0.1); color: var(--howso-primary); }
      .table-row:hover { background-color: rgba(241, 245, 249, 0.6); }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <div class="flex min-w-[1200px] min-h-screen">
    <!-- 左侧导航栏 -->
    <aside class="w-64 bg-card border-r border-border flex flex-col shrink-0">
      <div class="h-16 flex items-center gap-3 px-6 border-b border-border">
        <div class="w-9 h-9 rounded-lg bg-primary text-primary-foreground flex items-center justify-center">
          <i data-lucide="tower-control" class="w-5 h-5"></i>
        </div>
        <div>
          <p class="howso-text-base howso-font-semibold text-foreground">吉林铁塔</p>
          <p class="howso-text-xs text-muted-foreground">智能作业监管平台</p>
        </div>
      </div>
      <nav class="flex-1 p-4 space-y-1">
        <a href="web-task-management.html" data-dom-id="nav-task-management" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg howso-text-sm howso-font-medium text-foreground transition-colors">
          <i data-lucide="clipboard-list" class="w-5 h-5"></i>
          <span>任务管理</span>
        </a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg howso-text-sm howso-font-medium text-muted-foreground transition-colors">
          <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
          <span>数据统计</span>
        </a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg howso-text-sm howso-font-medium text-muted-foreground transition-colors">
          <i data-lucide="settings" class="w-5 h-5"></i>
          <span>系统管理</span>
        </a>
      </nav>
      <div class="p-4 border-t border-border">
        <div class="flex items-center gap-3 px-4 py-3 rounded-lg bg-muted/50">
          <div class="w-9 h-9 rounded-full bg-primary text-primary-foreground flex items-center justify-center howso-text-sm howso-font-semibold">王</div>
          <div>
            <p class="howso-text-sm howso-font-medium text-foreground">王建国</p>
            <p class="howso-text-xs text-muted-foreground">安全管理员</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- 顶部 Header -->
      <header class="h-16 bg-card border-b border-border px-6 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2 howso-text-sm text-muted-foreground">
          <span>首页</span>
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
          <a href="web-task-management.html" class="hover:text-foreground transition-colors">任务管理</a>
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
          <span class="text-foreground howso-font-medium">新增任务</span>
        </div>
        <div class="flex items-center gap-4">
          <div class="relative">
            <i data-lucide="search" class="w-4 h-4 text-muted-foreground absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input type="text" data-dom-id="search-task-input" placeholder="搜索工单编号 / 铁塔名称 / 负责人" class="h-9 w-72 rounded-lg border border-input bg-background pl-9 pr-3 howso-text-sm text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring">
          </div>
          <div class="relative">
            <i data-lucide="filter" class="w-4 h-4 text-muted-foreground absolute left-3 top-1/2 -translate-y-1/2"></i>
            <select data-dom-id="filter-status" class="h-9 w-32 appearance-none rounded-lg border border-input bg-background pl-9 pr-8 howso-text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-ring">
              <option value="">全部状态</option>
              <option value="pending">待开始</option>
              <option value="progress">进行中</option>
              <option value="completed">已完成</option>
              <option value="overdue">已逾期</option>
            </select>
            <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          </div>
          <a href="web-task-management.html" data-dom-id="btn-back-list" class="h-9 px-4 rounded-lg border border-border bg-card text-foreground howso-text-sm howso-font-medium flex items-center gap-1.5 hover:bg-muted transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>返回列表</span>
          </a>
          <button type="button" class="relative w-9 h-9 rounded-lg flex items-center justify-center text-muted-foreground hover:bg-muted transition-colors" aria-label="通知">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-error" style="background-color: var(--howso-state-error);"></span>
          </button>
          <div class="w-9 h-9 rounded-full bg-primary text-primary-foreground flex items-center justify-center howso-text-sm howso-font-semibold cursor-pointer">王</div>
        </div>
      </header>

      <!-- 页面内容 -->
      <main class="flex-1 p-6 overflow-auto">
        <!-- 流程步骤条 -->
        <section class="bg-card border border-border rounded-xl p-5 shadow-sm mb-6">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="route" class="w-5 h-5 text-primary"></i>
              <h2 class="howso-text-base howso-font-semibold text-foreground">任务全流程闭环</h2>
            </div>
            <span class="howso-text-xs text-muted-foreground">PC 端创建任务，APP 端执行并归档</span>
          </div>
          <div class="flex items-center mt-5">
            <div class="flex-1 flex items-center">
              <div class="flex flex-col items-center gap-2">
                <div class="w-10 h-10 rounded-full bg-primary text-primary-foreground flex items-center justify-center">
                  <i data-lucide="file-plus" class="w-5 h-5"></i>
                </div>
                <span class="howso-text-sm howso-font-medium text-foreground">创建</span>
              </div>
              <div class="flex-1 h-1 mx-3 rounded-full bg-primary/20"></div>
            </div>
            <div class="flex-1 flex items-center">
              <div class="flex flex-col items-center gap-2">
                <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background-color: rgba(245,158,11,0.15); color: var(--howso-state-warning);">
                  <i data-lucide="send" class="w-5 h-5"></i>
                </div>
                <span class="howso-text-sm howso-font-medium text-foreground">派发</span>
              </div>
              <div class="flex-1 h-1 mx-3 rounded-full bg-warning/20" style="background-color: rgba(245,158,11,0.2);"></div>
            </div>
            <div class="flex-1 flex items-center">
              <div class="flex flex-col items-center gap-2">
                <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background-color: rgba(59,130,246,0.15); color: var(--howso-state-info);">
                  <i data-lucide="hard-hat" class="w-5 h-5"></i>
                </div>
                <span class="howso-text-sm howso-font-medium text-foreground">执行</span>
              </div>
              <div class="flex-1 h-1 mx-3 rounded-full bg-info/20" style="background-color: rgba(59,130,246,0.2);"></div>
            </div>
            <div class="flex flex-col items-center gap-2">
              <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background-color: rgba(16,185,129,0.15); color: var(--howso-state-success);">
                <i data-lucide="flag" class="w-5 h-5"></i>
              </div>
              <span class="howso-text-sm howso-font-medium text-foreground">完成</span>
            </div>
          </div>
        </section>

        <!-- 新增任务表单 -->
        <form id="new-task-form" class="bg-card border border-border rounded-xl shadow-sm overflow-hidden" onsubmit="return handleCreateTask(event)">
          <div class="px-5 py-4 border-b border-border flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="clipboard-plus" class="w-5 h-5 text-primary"></i>
              <h2 class="howso-text-lg howso-font-semibold text-foreground">新增任务</h2>
            </div>
            <span class="howso-text-sm text-muted-foreground">请填写任务基础信息</span>
          </div>
          <div class="p-6 grid grid-cols-2 gap-6">
            <!-- 任务名称 -->
            <div class="col-span-2">
              <label class="block howso-text-sm howso-font-medium text-foreground mb-2" for="task-name">
                任务名称 <span class="text-error" style="color: var(--howso-state-error);">*</span>
              </label>
              <div class="relative">
                <i data-lucide="clipboard-list" class="w-4 h-4 text-muted-foreground absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="task-name" name="taskName" data-dom-id="input-task-name" placeholder="请输入任务名称，例如：前进大街基站设备巡检" required
                  class="h-10 w-full rounded-lg border border-input bg-background pl-9 pr-3 howso-text-sm text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring">
              </div>
            </div>

            <!-- 作业单位 -->
            <div>
              <label class="block howso-text-sm howso-font-medium text-foreground mb-2" for="work-unit">
                作业单位 <span class="text-error" style="color: var(--howso-state-error);">*</span>
              </label>
              <div class="relative">
                <i data-lucide="building-2" class="w-4 h-4 text-muted-foreground absolute left-3 top-1/2 -translate-y-1/2"></i>
                <select id="work-unit" name="workUnit" data-dom-id="select-work-unit" required
                  class="h-10 w-full appearance-none rounded-lg border border-input bg-background pl-9 pr-8 howso-text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-ring">
                  <option value="">请选择作业单位</option>
                  <option value="unit-1">长春市通信工程维护有限公司</option>
                  <option value="unit-2">吉林市铁塔维护中心</option>
                  <option value="unit-3">四平市基站运维队</option>
                  <option value="unit-4">延边州移动通信维护部</option>
                  <option value="unit-5">通化市铁塔作业班组</option>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              </div>
            </div>

            <!-- 作业时间 -->
            <div>
              <label class="block howso-text-sm howso-font-medium text-foreground mb-2" for="work-time">
                作业时间 <span class="text-error" style="color: var(--howso-state-error);">*</span>
              </label>
              <div class="relative">
                <i data-lucide="calendar-clock" class="w-4 h-4 text-muted-foreground absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="datetime-local" id="work-time" name="workTime" data-dom-id="input-work-time" required
                  class="h-10 w-full rounded-lg border border-input bg-background pl-9 pr-3 howso-text-sm text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring">
              </div>
              <p class="mt-1.5 howso-text-xs text-muted-foreground">请选择任务计划开始时间</p>
            </div>

            <!-- 关联塔 -->
            <div class="col-span-2">
              <label class="block howso-text-sm howso-font-medium text-foreground mb-2" for="related-tower">
                关联塔 <span class="text-error" style="color: var(--howso-state-error);">*</span>
              </label>
              <div class="relative">
                <i data-lucide="tower-control" class="w-4 h-4 text-muted-foreground absolute left-3 top-1/2 -translate-y-1/2"></i>
                <select id="related-tower" name="relatedTower" data-dom-id="select-related-tower" required
                  class="h-10 w-full appearance-none rounded-lg border border-input bg-background pl-9 pr-8 howso-text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-ring">
                  <option value="">请选择关联铁塔</option>
                  <option value="JL-CC-CY-0231">长春-朝阳-前进大街基站（JL-CC-CY-0231）</option>
                  <option value="JL-JL-FM-0087">吉林-丰满-松江路基站（JL-JL-FM-0087）</option>
                  <option value="JL-SP-TX-0156">四平-铁西-英雄大路基站（JL-SP-TX-0156）</option>
                  <option value="JL-YB-YJ-0422">延边-延吉-公园路基站（JL-YB-YJ-0422）</option>
                  <option value="JL-TH-DC-0319">通化-东昌-建设大街基站（JL-TH-DC-0319）</option>
                  <option value="JL-BC-TB-0098">白城-洮北-青年南街基站（JL-BC-TB-0098）</option>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              </div>
              <p class="mt-1.5 howso-text-xs text-muted-foreground">APP 端执行任务时将校验当前位置与所选铁塔经纬度偏差</p>
            </div>
          </div>

          <!-- 操作按钮 -->
          <div class="px-6 py-4 bg-muted/30 border-t border-border flex items-center justify-end gap-3">
            <a href="web-task-management.html" data-dom-id="btn-cancel" class="h-10 px-5 rounded-lg border border-border bg-card text-foreground howso-text-sm howso-font-medium flex items-center gap-1.5 hover:bg-muted transition-colors">
              <i data-lucide="x" class="w-4 h-4"></i>
              <span>取消</span>
            </a>
            <button type="submit" data-dom-id="btn-create-task" class="h-10 px-5 rounded-lg bg-primary text-primary-foreground howso-text-sm howso-font-medium flex items-center gap-1.5 hover:bg-primary/90 transition-colors">
              <i data-lucide="check" class="w-4 h-4"></i>
              <span>创建任务</span>
            </button>
          </div>
        </form>

        <!-- 提示信息 -->
        <div id="create-success" class="hidden mt-4 bg-success/10 border border-success/20 rounded-xl p-4 flex items-start gap-3" style="background-color: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.2);">
          <i data-lucide="circle-check" class="w-5 h-5 mt-0.5" style="color: var(--howso-state-success);"></i>
          <div>
            <p class="howso-text-sm howso-font-medium" style="color: var(--howso-state-success);">任务创建成功</p>
            <p class="howso-text-xs text-muted-foreground mt-0.5">任务已生成，可在任务列表中查看并进行派发。</p>
          </div>
        </div>
      </main>

      <script>
        function handleCreateTask(event) {
          event.preventDefault();
          const form = document.getElementById('new-task-form');
          const success = document.getElementById('create-success');
          const formData = new FormData(form);
          const task = {
            taskName: formData.get('taskName'),
            workUnit: formData.get('workUnit'),
            workTime: formData.get('workTime'),
            relatedTower: formData.get('relatedTower')
          };
          console.log('创建任务：', task);
          // 模拟创建成功
          success.classList.remove('hidden');
          form.reset();
          lucide.createIcons();
          setTimeout(() => {
            success.classList.add('hidden');
          }, 3000);
          return false;
        }
      </script>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
