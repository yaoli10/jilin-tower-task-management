<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理首页</title>
    <style id="theme-vars">
:root {
  --brand-prefix: howso;
  
  /* Primary blue scale */
  --howso-primary-50: #eff6ff;
  --howso-primary-100: #dbeafe;
  --howso-primary-200: #bfdbfe;
  --howso-primary-300: #93c5fd;
  --howso-primary-400: #60a5fa;
  --howso-primary-500: #3b82f6;
  --howso-primary-600: #2563eb;
  --howso-primary-700: #1d4ed8;
  --howso-primary-800: #1e40af;
  --howso-primary-900: #1e3a8a;
  
  /* Neutral gray scale */
  --howso-gray-50: #f8fafc;
  --howso-gray-100: #f1f5f9;
  --howso-gray-200: #e2e8f0;
  --howso-gray-300: #cbd5e1;
  --howso-gray-400: #94a3b8;
  --howso-gray-500: #64748b;
  --howso-gray-600: #475569;
  --howso-gray-700: #334155;
  --howso-gray-800: #1e293b;
  --howso-gray-900: #0f172a;
  
  /* State colors */
  --howso-state-success: #10b981;
  --howso-state-warning: #f59e0b;
  --howso-state-error: #ef4444;
  --howso-state-info: #3b82f6;
  
  /* Semantic aliases */
  --howso-background: #ffffff;
  --howso-foreground: #0f172a;
  --howso-card: #ffffff;
  --howso-card-foreground: #0f172a;
  --howso-popover: #ffffff;
  --howso-popover-foreground: #0f172a;
  --howso-primary: #2563eb;
  --howso-primary-foreground: #ffffff;
  --howso-muted: #f1f5f9;
  --howso-muted-foreground: #64748b;
  --howso-border: #e2e8f0;
  --howso-input: #e2e8f0;
  --howso-ring: #3b82f6;
  --howso-radius-small: 4px;
  --howso-radius-medium: 8px;
  --howso-radius-large: 12px;
}

.dark {
  --howso-background: #0f172a;
  --howso-foreground: #f8fafc;
  --howso-card: #1e293b;
  --howso-card-foreground: #f8fafc;
  --howso-popover: #1e293b;
  --howso-popover-foreground: #f8fafc;
  --howso-primary: #3b82f6;
  --howso-primary-foreground: #ffffff;
  --howso-muted: #334155;
  --howso-muted-foreground: #94a3b8;
  --howso-border: #334155;
  --howso-input: #334155;
}

* {
  box-sizing: border-box;
}

body {
  font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--howso-background);
  color: var(--howso-foreground);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Typography system */
.howso-text-xs { font-size: 12px; line-height: 16px; }
.howso-text-sm { font-size: 13px; line-height: 18px; }
.howso-text-base { font-size: 14px; line-height: 20px; }
.howso-text-lg { font-size: 16px; line-height: 24px; }
.howso-text-xl { font-size: 18px; line-height: 28px; }
.howso-text-2xl { font-size: 20px; line-height: 30px; }
.howso-text-3xl { font-size: 24px; line-height: 32px; }

.howso-font-medium { font-weight: 500; }
.howso-font-semibold { font-weight: 600; }
.howso-font-bold { font-weight: 700; }

.howso-text-primary { color: var(--howso-primary); }
.howso-text-muted { color: var(--howso-muted-foreground); }
.howso-text-success { color: var(--howso-state-success); }
.howso-text-warning { color: var(--howso-state-warning); }
.howso-text-error { color: var(--howso-state-error); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--howso-background);
    --color-foreground: var(--howso-foreground);
    --color-card: var(--howso-card);
    --color-card-foreground: var(--howso-card-foreground);
    --color-popover: var(--howso-popover);
    --color-popover-foreground: var(--howso-popover-foreground);
    --color-primary: var(--howso-primary);
    --color-primary-foreground: var(--howso-primary-foreground);
    --color-muted: var(--howso-muted);
    --color-muted-foreground: var(--howso-muted-foreground);
    --color-border: var(--howso-border);
    --color-input: var(--howso-input);
    --color-ring: var(--howso-ring);
    --radius-sm: var(--howso-radius-small);
    --radius-md: var(--howso-radius-medium);
    --radius-lg: var(--howso-radius-large);
  }
  @layer base {
    body { background: var(--howso-background); color: var(--howso-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--howso-background); }
      .text-background { color: var(--howso-background); }
      .border-background { border-color: var(--howso-background); }
      .ring-background { --tw-ring-color: var(--howso-background); }
      .bg-foreground { background-color: var(--howso-foreground); }
      .text-foreground { color: var(--howso-foreground); }
      .border-foreground { border-color: var(--howso-foreground); }
      .ring-foreground { --tw-ring-color: var(--howso-foreground); }
      .bg-card { background-color: var(--howso-card); }
      .text-card { color: var(--howso-card); }
      .border-card { border-color: var(--howso-card); }
      .ring-card { --tw-ring-color: var(--howso-card); }
      .bg-card-foreground { background-color: var(--howso-card-foreground); }
      .text-card-foreground { color: var(--howso-card-foreground); }
      .border-card-foreground { border-color: var(--howso-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--howso-card-foreground); }
      .bg-popover { background-color: var(--howso-popover); }
      .text-popover { color: var(--howso-popover); }
      .border-popover { border-color: var(--howso-popover); }
      .ring-popover { --tw-ring-color: var(--howso-popover); }
      .bg-popover-foreground { background-color: var(--howso-popover-foreground); }
      .text-popover-foreground { color: var(--howso-popover-foreground); }
      .border-popover-foreground { border-color: var(--howso-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--howso-popover-foreground); }
      .bg-primary { background-color: var(--howso-primary); }
      .text-primary { color: var(--howso-primary); }
      .border-primary { border-color: var(--howso-primary); }
      .ring-primary { --tw-ring-color: var(--howso-primary); }
      .bg-primary-foreground { background-color: var(--howso-primary-foreground); }
      .text-primary-foreground { color: var(--howso-primary-foreground); }
      .border-primary-foreground { border-color: var(--howso-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--howso-primary-foreground); }
      .bg-muted { background-color: var(--howso-muted); }
      .text-muted { color: var(--howso-muted); }
      .border-muted { border-color: var(--howso-muted); }
      .ring-muted { --tw-ring-color: var(--howso-muted); }
      .bg-muted-foreground { background-color: var(--howso-muted-foreground); }
      .text-muted-foreground { color: var(--howso-muted-foreground); }
      .border-muted-foreground { border-color: var(--howso-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--howso-muted-foreground); }
      .bg-border { background-color: var(--howso-border); }
      .text-border { color: var(--howso-border); }
      .border-border { border-color: var(--howso-border); }
      .ring-border { --tw-ring-color: var(--howso-border); }
      .bg-input { background-color: var(--howso-input); }
      .text-input { color: var(--howso-input); }
      .border-input { border-color: var(--howso-input); }
      .ring-input { --tw-ring-color: var(--howso-input); }
      .bg-ring { background-color: var(--howso-ring); }
      .text-ring { color: var(--howso-ring); }
      .border-ring { border-color: var(--howso-ring); }
      .ring-ring { --tw-ring-color: var(--howso-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <div class="max-w-[430px] mx-auto min-h-screen flex flex-col bg-background">
    <header class="sticky top-0 z-10 bg-background/95 backdrop-blur-sm border-b border-border px-4 py-3 flex items-center justify-between">
      <h1 class="howso-text-xl howso-font-semibold text-foreground">任务管理</h1>
      <a href="new-task-tower.html" data-dom-id="btn-add-task" class="w-10 h-10 rounded-full bg-primary text-primary-foreground flex items-center justify-center shadow-md active:scale-95 transition-transform" aria-label="新增任务">
        <i data-lucide="plus" class="w-5 h-5"></i>
      </a>
    </header>

    <main class="flex-1 p-4 space-y-5 overflow-y-auto">
      <section class="grid grid-cols-2 gap-3">
        <div class="bg-card border border-border rounded-xl p-4 shadow-sm flex flex-col justify-between gap-2" data-dom-id="stat-today">
          <div class="w-9 h-9 rounded-lg bg-primary/10 text-primary flex items-center justify-center">
            <i data-lucide="calendar-check" class="w-5 h-5"></i>
          </div>
          <div>
            <p class="howso-text-xs howso-text-muted">今日任务</p>
            <p class="howso-text-2xl howso-font-bold text-foreground mt-0.5">3</p>
          </div>
        </div>
        <div class="bg-card border border-border rounded-xl p-4 shadow-sm flex flex-col justify-between gap-2" data-dom-id="stat-pending">
          <div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background-color: rgba(245,158,11,0.1); color: var(--howso-state-warning);">
            <i data-lucide="clock" class="w-5 h-5"></i>
          </div>
          <div>
            <p class="howso-text-xs howso-text-muted">待完成</p>
            <p class="howso-text-2xl howso-font-bold text-foreground mt-0.5">1</p>
          </div>
        </div>
        <div class="bg-card border border-border rounded-xl p-4 shadow-sm flex flex-col justify-between gap-2" data-dom-id="stat-completed">
          <div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background-color: rgba(16,185,129,0.1); color: var(--howso-state-success);">
            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
          </div>
          <div>
            <p class="howso-text-xs howso-text-muted">已完成</p>
            <p class="howso-text-2xl howso-font-bold text-foreground mt-0.5">2</p>
          </div>
        </div>
        <div class="bg-card border border-border rounded-xl p-4 shadow-sm flex flex-col justify-between gap-2" data-dom-id="stat-tower-pending">
          <div class="w-9 h-9 rounded-lg bg-muted text-muted-foreground flex items-center justify-center">
            <i data-lucide="map-pin" class="w-5 h-5"></i>
          </div>
          <div>
            <p class="howso-text-xs howso-text-muted">塔址待确认</p>
            <p class="howso-text-2xl howso-font-bold text-foreground mt-0.5">0</p>
          </div>
        </div>
      </section>

      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="howso-text-lg howso-font-semibold text-foreground">任务列表</h2>
          <button type="button" data-dom-id="btn-filter-tasks" class="howso-text-sm text-primary flex items-center gap-1">
            全部 <i data-lucide="chevron-down" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="bg-card border border-border rounded-xl p-4 shadow-sm space-y-3 mb-4" data-dom-id="task-filter-card">
          <div class="space-y-2">
            <label for="filter-task-name" class="howso-text-sm howso-font-medium text-foreground">任务名称</label>
            <div class="relative">
              <i data-lucide="search" class="w-4 h-4 text-muted-foreground absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input type="text" id="filter-task-name" data-dom-id="filter-task-name" placeholder="搜索任务名称 / 铁塔名称" class="w-full rounded-xl border border-input bg-background pl-9 pr-4 py-3 howso-text-base text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-2">
              <label for="filter-task-time" class="howso-text-sm howso-font-medium text-foreground">任务时间</label>
              <div class="relative">
                <input type="date" id="filter-task-time" data-dom-id="filter-task-time" class="w-full rounded-xl border border-input bg-background px-3 py-3 howso-text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-ring">
              </div>
            </div>
            <div class="space-y-2">
              <label for="filter-task-status" class="howso-text-sm howso-font-medium text-foreground">任务状态</label>
              <div class="relative">
                <select id="filter-task-status" data-dom-id="filter-task-status" class="w-full appearance-none rounded-xl border border-input bg-background px-3 py-3 howso-text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-ring">
                  <option value="">全部状态</option>
                  <option value="pending">待开始</option>
                  <option value="progress">进行中</option>
                  <option value="completed">已完成</option>
                  <option value="overdue">已逾期</option>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="space-y-3">
          <a href="task-detail.html" data-dom-id="task-card-1" class="block bg-card border border-border rounded-xl p-4 shadow-sm active:bg-muted/50 transition-colors cursor-pointer">
            <div class="flex items-start justify-between gap-2">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1.5">
                  <span class="howso-text-xs text-primary bg-primary/10 px-2 py-0.5 rounded-md howso-font-medium truncate max-w-[160px]">前进大街基站设备巡检</span>
                  <span class="howso-text-xs px-2 py-0.5 rounded-md howso-font-medium" style="color: var(--howso-state-warning); background-color: rgba(245,158,11,0.1);">进行中</span>
                </div>
                <h3 class="howso-text-base howso-font-semibold text-foreground truncate">长春-朝阳-前进大街基站</h3>
                <p class="howso-text-sm howso-text-muted mt-1">2025-09-08 09:00 ~ 11:00</p>
              </div>
              <i data-lucide="chevron-right" class="w-5 h-5 text-muted-foreground shrink-0 mt-1"></i>
            </div>
          </a>

          <a href="task-detail.html" data-dom-id="task-card-2" class="block bg-card border border-border rounded-xl p-4 shadow-sm active:bg-muted/50 transition-colors cursor-pointer">
            <div class="flex items-start justify-between gap-2">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1.5">
                  <span class="howso-text-xs text-primary bg-primary/10 px-2 py-0.5 rounded-md howso-font-medium truncate max-w-[160px]">松江路基站 RRU 检修</span>
                  <span class="howso-text-xs px-2 py-0.5 rounded-md howso-font-medium" style="color: var(--howso-state-success); background-color: rgba(16,185,129,0.1);">已完成</span>
                </div>
                <h3 class="howso-text-base howso-font-semibold text-foreground truncate">吉林-丰满-松江路基站</h3>
                <p class="howso-text-sm howso-text-muted mt-1">2025-09-07 14:00 ~ 16:30</p>
              </div>
              <i data-lucide="chevron-right" class="w-5 h-5 text-muted-foreground shrink-0 mt-1"></i>
            </div>
          </a>
        </div>
      </section>
    </main>

    <nav class="shrink-0 bg-card border-t border-border px-6 py-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))]">
      <div class="flex justify-around items-center">
        <a href="task-home.html" data-dom-id="nav-task-home" class="flex flex-col items-center gap-1 py-2 px-4 text-primary">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span class="howso-text-xs howso-font-medium">任务管理</span>
        </a>
        <a href="my-profile.html" data-dom-id="nav-my-profile" class="flex flex-col items-center gap-1 py-2 px-4 text-muted-foreground">
          <i data-lucide="user" class="w-5 h-5"></i>
          <span class="howso-text-xs howso-font-medium">我的</span>
        </a>
      </div>
    </nav>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
