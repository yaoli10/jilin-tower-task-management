<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增任务（1/2）</title>
    <style id="theme-vars">
:root {
  --brand-prefix: howso;
  --howso-primary-50: #eff6ff;
  --howso-primary-100: #dbeafe;
  --howso-primary-200: #bfdbfe;
  --howso-primary-300: #93c5fd;
  --howso-primary-400: #60a5fa;
  --howso-primary-500: #3b82f6;
  --howso-primary-600: #2563eb;
  --howso-primary-700: #1d4ed8;
  --howso-primary-800: #1e40af;
  --howso-primary-900: #1e3a8a;
  --howso-gray-50: #f8fafc;
  --howso-gray-100: #f1f5f9;
  --howso-gray-200: #e2e8f0;
  --howso-gray-300: #cbd5e1;
  --howso-gray-400: #94a3b8;
  --howso-gray-500: #64748b;
  --howso-gray-600: #475569;
  --howso-gray-700: #334155;
  --howso-gray-800: #1e293b;
  --howso-gray-900: #0f172a;
  --howso-state-success: #10b981;
  --howso-state-warning: #f59e0b;
  --howso-state-error: #ef4444;
  --howso-state-info: #3b82f6;
  --howso-background: #ffffff;
  --howso-foreground: #0f172a;
  --howso-card: #ffffff;
  --howso-card-foreground: #0f172a;
  --howso-popover: #ffffff;
  --howso-popover-foreground: #0f172a;
  --howso-primary: #2563eb;
  --howso-primary-foreground: #ffffff;
  --howso-muted: #f1f5f9;
  --howso-muted-foreground: #64748b;
  --howso-border: #e2e8f0;
  --howso-input: #e2e8f0;
  --howso-ring: #3b82f6;
  --howso-radius-small: 4px;
  --howso-radius-medium: 8px;
  --howso-radius-large: 12px;
}
.dark {
  --howso-background: #0f172a;
  --howso-foreground: #f8fafc;
  --howso-card: #1e293b;
  --howso-card-foreground: #f8fafc;
  --howso-popover: #1e293b;
  --howso-popover-foreground: #f8fafc;
  --howso-primary: #3b82f6;
  --howso-primary-foreground: #ffffff;
  --howso-muted: #334155;
  --howso-muted-foreground: #94a3b8;
  --howso-border: #334155;
  --howso-input: #334155;
}
* { box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--howso-background);
  color: var(--howso-foreground);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.howso-text-xs { font-size: 12px; line-height: 16px; }
.howso-text-sm { font-size: 13px; line-height: 18px; }
.howso-text-base { font-size: 14px; line-height: 20px; }
.howso-text-lg { font-size: 16px; line-height: 24px; }
.howso-text-xl { font-size: 18px; line-height: 28px; }
.howso-text-2xl { font-size: 20px; line-height: 30px; }
.howso-text-3xl { font-size: 24px; line-height: 32px; }
.howso-font-medium { font-weight: 500; }
.howso-font-semibold { font-weight: 600; }
.howso-font-bold { font-weight: 700; }
.howso-text-primary { color: var(--howso-primary); }
.howso-text-muted { color: var(--howso-muted-foreground); }
.howso-text-success { color: var(--howso-state-success); }
.howso-text-warning { color: var(--howso-state-warning); }
.howso-text-error { color: var(--howso-state-error); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--howso-background);
    --color-foreground: var(--howso-foreground);
    --color-card: var(--howso-card);
    --color-card-foreground: var(--howso-card-foreground);
    --color-popover: var(--howso-popover);
    --color-popover-foreground: var(--howso-popover-foreground);
    --color-primary: var(--howso-primary);
    --color-primary-foreground: var(--howso-primary-foreground);
    --color-muted: var(--howso-muted);
    --color-muted-foreground: var(--howso-muted-foreground);
    --color-border: var(--howso-border);
    --color-input: var(--howso-input);
    --color-ring: var(--howso-ring);
    --radius-sm: var(--howso-radius-small);
    --radius-md: var(--howso-radius-medium);
    --radius-lg: var(--howso-radius-large);
  }
  @layer base {
    body { background: var(--howso-background); color: var(--howso-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--howso-background); }
      .text-background { color: var(--howso-background); }
      .border-background { border-color: var(--howso-background); }
      .ring-background { --tw-ring-color: var(--howso-background); }
      .bg-foreground { background-color: var(--howso-foreground); }
      .text-foreground { color: var(--howso-foreground); }
      .border-foreground { border-color: var(--howso-foreground); }
      .ring-foreground { --tw-ring-color: var(--howso-foreground); }
      .bg-card { background-color: var(--howso-card); }
      .text-card { color: var(--howso-card); }
      .border-card { border-color: var(--howso-card); }
      .ring-card { --tw-ring-color: var(--howso-card); }
      .bg-card-foreground { background-color: var(--howso-card-foreground); }
      .text-card-foreground { color: var(--howso-card-foreground); }
      .border-card-foreground { border-color: var(--howso-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--howso-card-foreground); }
      .bg-popover { background-color: var(--howso-popover); }
      .text-popover { color: var(--howso-popover); }
      .border-popover { border-color: var(--howso-popover); }
      .ring-popover { --tw-ring-color: var(--howso-popover); }
      .bg-popover-foreground { background-color: var(--howso-popover-foreground); }
      .text-popover-foreground { color: var(--howso-popover-foreground); }
      .border-popover-foreground { border-color: var(--howso-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--howso-popover-foreground); }
      .bg-primary { background-color: var(--howso-primary); }
      .text-primary { color: var(--howso-primary); }
      .border-primary { border-color: var(--howso-primary); }
      .ring-primary { --tw-ring-color: var(--howso-primary); }
      .bg-primary-foreground { background-color: var(--howso-primary-foreground); }
      .text-primary-foreground { color: var(--howso-primary-foreground); }
      .border-primary-foreground { border-color: var(--howso-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--howso-primary-foreground); }
      .bg-muted { background-color: var(--howso-muted); }
      .text-muted { color: var(--howso-muted); }
      .border-muted { border-color: var(--howso-muted); }
      .ring-muted { --tw-ring-color: var(--howso-muted); }
      .bg-muted-foreground { background-color: var(--howso-muted-foreground); }
      .text-muted-foreground { color: var(--howso-muted-foreground); }
      .border-muted-foreground { border-color: var(--howso-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--howso-muted-foreground); }
      .bg-border { background-color: var(--howso-border); }
      .text-border { color: var(--howso-border); }
      .border-border { border-color: var(--howso-border); }
      .ring-border { --tw-ring-color: var(--howso-border); }
      .bg-input { background-color: var(--howso-input); }
      .text-input { color: var(--howso-input); }
      .border-input { border-color: var(--howso-input); }
      .ring-input { --tw-ring-color: var(--howso-input); }
      .bg-ring { background-color: var(--howso-ring); }
      .text-ring { color: var(--howso-ring); }
      .border-ring { border-color: var(--howso-ring); }
      .ring-ring { --tw-ring-color: var(--howso-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <div class="max-w-[430px] mx-auto min-h-screen flex flex-col bg-background">
    <header class="sticky top-0 z-10 bg-background/95 backdrop-blur-sm border-b border-border px-4 py-3 flex items-center gap-3">
      <button type="button" data-dom-id="btn-back-home" onclick="location.href='task-home.html'" class="w-9 h-9 rounded-lg flex items-center justify-center text-foreground hover:bg-muted active:bg-muted/80 transition-colors" aria-label="返回">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <h1 class="howso-text-lg howso-font-semibold text-foreground flex-1 text-center pr-12">新增任务（1/2）</h1>
    </header>

    <main class="flex-1 p-4 space-y-5 overflow-y-auto">
      <section class="bg-card border border-border rounded-xl overflow-hidden shadow-sm" data-dom-id="map-current-location">
        <div class="h-40 bg-gradient-to-br from-primary/10 to-muted relative flex items-center justify-center">
          <div class="absolute inset-0 opacity-30" style="background-image: radial-gradient(var(--howso-border) 1px, transparent 1px); background-size: 16px 16px;"></div>
          <div class="relative flex flex-col items-center gap-2">
            <div class="w-12 h-12 rounded-full bg-primary text-primary-foreground flex items-center justify-center shadow-lg">
              <i data-lucide="map-pin" class="w-6 h-6"></i>
            </div>
            <span class="howso-text-sm howso-font-medium text-foreground">当前位置</span>
          </div>
        </div>
        <div class="px-4 py-3 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <i data-lucide="navigation" class="w-4 h-4 text-primary"></i>
            <span class="howso-text-sm howso-text-muted">GPS 定位中</span>
          </div>
          <span class="howso-text-xs text-primary bg-primary/10 px-2 py-0.5 rounded-md">精度 5 米</span>
        </div>
      </section>

      <section class="bg-card border border-border rounded-xl p-4 shadow-sm space-y-3" data-dom-id="task-name-card">
        <div class="flex items-center justify-between">
          <h2 class="howso-text-base howso-font-semibold text-foreground">任务名称</h2>
          <span class="howso-text-xs text-primary bg-primary/10 px-2 py-0.5 rounded-md howso-font-medium">PC端自动同步</span>
        </div>
        <div class="p-3 rounded-xl bg-muted/30 border border-border">
          <p id="task-name-display" class="howso-text-base text-foreground howso-font-medium">前进大街基站设备巡检</p>
          <p class="howso-text-xs howso-text-muted mt-1">由 PC 端创建任务时设置，APP 端不可修改</p>
        </div>
      </section>

      <section class="bg-card border border-border rounded-xl p-4 shadow-sm space-y-3" data-dom-id="linked-tower-card">
        <div class="flex items-center justify-between">
          <h2 class="howso-text-base howso-font-semibold text-foreground">已关联塔址</h2>
          <span class="howso-text-xs howso-text-muted">自动匹配</span>
        </div>
        <div class="flex items-start gap-3">
          <div class="w-10 h-10 rounded-lg bg-primary/10 text-primary flex items-center justify-center shrink-0">
            <i data-lucide="tower-control" class="w-5 h-5"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="howso-text-base howso-font-medium text-foreground truncate">长春-朝阳-前进大街基站</p>
            <p class="howso-text-sm howso-text-muted mt-0.5">编号：JL-CC-CY-0231</p>
          </div>
        </div>
        <div class="flex items-center gap-2 pt-2 border-t border-border">
          <i data-lucide="ruler" class="w-4 h-4 howso-text-muted"></i>
          <span class="howso-text-sm text-foreground">距离当前位置约 <span class="howso-font-semibold text-primary">32 米</span></span>
        </div>
      </section>

      <section class="pt-2 space-y-3">
        <a href="verify-personnel.html" data-dom-id="btn-next-time" class="block w-full py-3.5 rounded-xl bg-primary text-primary-foreground howso-text-base howso-font-semibold shadow-md active:scale-[0.98] transition-transform text-center">
          位置正确，下一步
        </a>
        <button type="button" data-dom-id="btn-correct-tower" onclick="openTowerChangeModal()" class="w-full py-3.5 rounded-xl bg-card border border-border text-foreground howso-text-base howso-font-medium active:bg-muted transition-colors">
          位置不对，申请变更
        </button>
      </section>
    </main>

  </div>

  <div id="tower-change-modal" class="hidden fixed inset-0 z-50 items-end sm:items-center justify-center bg-black/50 p-4" aria-hidden="true">
    <div class="w-full max-w-[430px] bg-card rounded-t-2xl sm:rounded-2xl p-5 shadow-xl space-y-4 max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between">
        <h3 class="howso-text-lg howso-font-semibold text-foreground">塔址变更申请</h3>
        <button type="button" data-dom-id="btn-close-tower-modal" class="w-8 h-8 rounded-full flex items-center justify-center text-muted-foreground hover:bg-muted">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-2">
        <label class="howso-text-sm howso-font-medium text-foreground">现场照片</label>
        <button type="button" data-dom-id="btn-upload-tower-photo" class="w-full h-28 rounded-xl border-2 border-dashed border-input bg-muted flex flex-col items-center justify-center gap-2 text-muted-foreground active:bg-muted/80 transition-colors">
          <i data-lucide="camera" class="w-7 h-7"></i>
          <span class="howso-text-sm">点击上传现场照片</span>
        </button>
      </div>

      <div class="space-y-2">
        <label class="howso-text-sm howso-font-medium text-foreground">重新选择塔址</label>
        <div class="relative">
          <select data-dom-id="select-tower-search" class="w-full appearance-none rounded-xl border border-input bg-background px-4 py-3 howso-text-base text-foreground focus:outline-none focus:ring-2 focus:ring-ring">
            <option>长春-朝阳-前进大街基站</option>
            <option>长春-朝阳-卫星路基站</option>
            <option>长春-朝阳-人民大街基站</option>
          </select>
          <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        </div>
      </div>

      <div class="space-y-2">
        <label class="howso-text-sm howso-font-medium text-foreground">偏差原因</label>
        <textarea data-dom-id="textarea-deviation-reason" rows="4" placeholder="请说明塔址与实际位置存在偏差的原因…" class="w-full rounded-xl border border-input bg-background px-4 py-3 howso-text-base text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring resize-none"></textarea>
      </div>

      <button type="button" data-dom-id="btn-save-tower-change" class="w-full py-3.5 rounded-xl bg-primary text-primary-foreground howso-text-base howso-font-semibold shadow-md active:scale-[0.98] transition-transform">
        保存变更申请
      </button>
    </div>
  </div>

  <script>
    function openTowerChangeModal() {
      const modal = document.getElementById('tower-change-modal');
      if (!modal) return;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      modal.setAttribute('aria-hidden','false');
    }
    (function(){
      const saved = localStorage.getItem('howso_pc_new_task');
      if (saved) {
        try {
          const task = JSON.parse(saved);
          const towerMap = {
            'JL-CC-CY-0231': {name:'长春-朝阳-前进大街基站', code:'JL-CC-CY-0231'},
            'JL-JL-FM-0087': {name:'吉林-丰满-松江路基站', code:'JL-JL-FM-0087'},
            'JL-SP-TX-0156': {name:'四平-铁西-英雄大路基站', code:'JL-SP-TX-0156'},
            'JL-YB-YJ-0422': {name:'延边-延吉-公园路基站', code:'JL-YB-YJ-0422'},
            'JL-TH-DC-0319': {name:'通化-东昌-建设大街基站', code:'JL-TH-DC-0319'},
            'JL-BC-TB-0098': {name:'白城-洮北-青年南街基站', code:'JL-BC-TB-0098'}
          };
          const nameDisplay = document.getElementById('task-name-display');
          if (nameDisplay && task.taskName) {
            nameDisplay.textContent = task.taskName;
          }
          const tower = towerMap[task.relatedTower];
          if (tower) {
            const card = document.querySelector('[data-dom-id="linked-tower-card"]');
            if (card) {
              const badge = card.querySelector('.howso-text-xs.howso-text-muted');
              if (badge) badge.textContent = 'PC端已同步';
              const nameEl = card.querySelector('p.howso-text-base.howso-font-medium');
              const codeEl = card.querySelector('p.howso-text-sm.howso-text-muted');
              if (nameEl) nameEl.textContent = tower.name;
              if (codeEl) codeEl.textContent = '编号：' + tower.code;
            }
          }
        } catch (e) {}
      }
    })();
    (function(){
      const modal = document.getElementById('tower-change-modal');
      const closeBtn = document.querySelector('[data-dom-id="btn-close-tower-modal"]');
      closeBtn.addEventListener('click', function(){
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        modal.setAttribute('aria-hidden','true');
      });
      modal.addEventListener('click', function(e){
        if(e.target === modal){
          modal.classList.add('hidden');
          modal.classList.remove('flex');
          modal.setAttribute('aria-hidden','true');
        }
      });
    })();
    lucide.createIcons();
  </script>
</body>
</html>
